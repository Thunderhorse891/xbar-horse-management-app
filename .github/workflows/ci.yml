name: ci

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install Playwright browser
        # Prefer the full install (browser + system deps). GitHub's
        # ubuntu-latest image already ships Chromium's runtime libraries, so
        # fall back to a deps-free browser install when the runner's apt
        # sources are temporarily broken (e.g. an unsigned upstream repo).
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Production smoke test (built dist)
        run: npm run test:prod-smoke

      # Drives the password-recovery flow on a rendered, Supabase-configured
      # web bundle. The prod-smoke suite above cannot cover it: build:local
      # strips the Supabase credentials to enable local mode, so the reset
      # screen there only ever reports that cloud accounts are unconfigured.
      - name: Password recovery smoke test (supabase-configured web bundle)
        run: npm run test:auth-smoke

      # The only check that proves the STORE build behaves differently from the
      # web build. The gates are runtime checks a bundler cannot tree-shake, so
      # the strings survive in the JavaScript either way and grepping the bundle
      # proves nothing -- what renders is what matters. Builds twice on purpose:
      # the billing assertions need a local-mode bundle (a workspace can be
      # created without a session, so the screen is reachable) with payment
      # links configured, and the sign-in assertions need a Supabase-configured
      # one, or their absence would prove auth was unconfigured rather than that
      # the gate worked.
      - name: Store build smoke test (native bundle)
        run: npm run test:mobile-smoke

      - name: Upload smoke test traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: prod-smoke-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
